<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コンテンツ管理</title>
</head>
<body>
  <!-- Decap CMS本体を読み込みます。ここは基本的に変更不要です -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 本文エディタに「文字を大きく」「文字を小さく」「ピンク文字」ボタンを追加します -->
  <script>
    CMS.registerEditorComponent({
      id: 'large-text',
      label: '大文字',
      fields: [{ name: 'body', label: '文字', widget: 'string' }],
      pattern: /^\{large\}([\s\S]*?)\{\/large\}$/,
      fromBlock: match => ({ body: match[1] }),
      toBlock: data => `{large}${data.body}{/large}`,
      toPreview: data => `<span style="font-size:2.7em;">${data.body}</span>`,
    });
    CMS.registerEditorComponent({
      id: 'small-text',
      label: '小文字',
      fields: [{ name: 'body', label: '文字', widget: 'string' }],
      pattern: /^\{small\}([\s\S]*?)\{\/small\}$/,
      fromBlock: match => ({ body: match[1] }),
      toBlock: data => `{small}${data.body}{/small}`,
      toPreview: data => `<span style="font-size:0.8em;">${data.body}</span>`,
    });
    CMS.registerEditorComponent({
      id: 'pink-text',
      label: 'ピンク',
      fields: [{ name: 'body', label: '文字', widget: 'string' }],
      pattern: /^\{pink\}([\s\S]*?)\{\/pink\}$/,
      fromBlock: match => ({ body: match[1] }),
      toBlock: data => `{pink}${data.body}{/pink}`,
      toPreview: data => `<span style="color:#F58F98;">${data.body}</span>`,
    });
    // Image(大)・Image(小)を「original用」「works用」で分け、アップロード先フォルダも分ける
    function makeImageComponents(prefix, folder, label){
      CMS.registerEditorComponent({
        id: `single-image-${prefix}`,
        label: `Image(大)${label}`,
        fields: [
          { name: 'src', label: '画像', widget: 'image', media_folder: folder, public_folder: '/' + folder },
          { name: 'text', label: '説明書き', widget: 'string', required: false },
        ],
        pattern: /^\{fullimg src="([^"]*)"(?:\s+text="([^"]*)")?\}$/,
        fromBlock: match => ({ src: match[1], text: match[2] || '' }),
        toBlock: data => `{fullimg src="${data.src || ''}"${data.text ? ` text="${data.text}"` : ''}}`,
        toPreview: data => `<img src="${data.src}" style="width:100%;" />${data.text ? `<div style="font-size:12px;color:#999;">${data.text}</div>` : ''}`,
      });
      CMS.registerEditorComponent({
        id: `image-${prefix}`,
        label: `Image(小)${label}`,
        fields: [
          { name: 'src', label: '画像', widget: 'image', media_folder: folder, public_folder: '/' + folder },
          { name: 'text', label: '説明書き', widget: 'string', required: false },
        ],
        pattern: /^\{img src="([^"]*)"(?:\s+text="([^"]*)")?\}$/,
        fromBlock: match => ({ src: match[1], text: match[2] || '' }),
        toBlock: data => `{img src="${data.src || ''}"${data.text ? ` text="${data.text}"` : ''}}`,
        toPreview: data => `<img src="${data.src}" style="max-width:100%;" />${data.text ? `<div style="font-size:12px;color:#999;">${data.text}</div>` : ''}`,
      });
    }
    makeImageComponents('mv', 'assets/uploads/original', '');
    makeImageComponents('works', 'assets/uploads/works', '');
  </script>
</body>
</html>
